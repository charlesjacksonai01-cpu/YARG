name: Builds - Linux ARM64 (Pi)

on:
  push:
    branches: [ "phase3-unity-audio" ]
  workflow_dispatch:

jobs:
  build-linux-arm64:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore YARG.Core dependencies
        run: |
          cd YARG.Core
          dotnet restore
          dotnet build --configuration Release

      - name: Restore Unity Packages (NuGetForUnity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CI: true
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: 6000.3.5f2
          customActions: |
            - name: Restore NuGet packages
              method: NuGetForUnity.NuGetForUnityPackageRestorer.Restore
              args: ["force", "--dry-run=false"]

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: 6000.3.5f2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yarg-linux-arm64
          path: build
